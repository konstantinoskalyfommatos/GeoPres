[project]
name = "GeoPres"
version = "0.1.0"
description = "Embedding dimensionality reduction and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets",
    "matplotlib",
    "mteb",
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "safetensors",
    "scikit-learn",
    "scipy",
    "sentence-transformers==5.3.0",
    "torch",
    "torchsort",
    "tqdm",
    "transformers==4.57.6",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn>=2.5.0",
]

[project.scripts]
train-model = "scripts.train.train_model:main"
train-autoencoder = "scripts.train.train_autoencoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]
