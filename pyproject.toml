[project]
name = "geopres"
version = "0.1.0"
description = "Embedding dimensionality reduction and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets",
    "matplotlib",
    "mteb",
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "safetensors",
    "scikit-learn",
    "scipy",
    "sentence-transformers==5.3.0",
    "statsmodels>=0.14.6",
    "torch",
    "torchsort",
    "tqdm",
    "transformers==4.57.6",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This is research code run directly with `python` (scripts live in `geopres/`
# and do bare imports like `from config import ...`), not an installable package.
# Skip building/installing the project itself; `uv sync` only sets up the venv
# and installs dependencies. Run scripts with PYTHONPATH=geopres.
[tool.uv]
package = false
